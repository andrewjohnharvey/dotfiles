# Rift config generated from ~/.config/omniwm/settings.toml
# Source: ~/.config/omniwm/settings.toml

[settings]
animate = true
# Shorter duration + ease-out so the scroll glide responds immediately and
# settles, instead of trailing the finger like a long ease-in-out does.
animation_duration = 0.12
animation_fps = 120.0
animation_easing = "ease_out_quad"
default_disable = false
focus_follows_mouse = false
mouse_follows_focus = true
mouse_hides_on_focus = false
auto_focus_blacklist = [
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.apple.Spotlight",
  "com.raycast.macos",
  # tldraw grabs focus back 0-34ms after losing it, including from other
  # workspaces, which drags the workspace switch with it. Ignore its requests.
  "com.tldraw.desktop",
  # Edge has windows on workspace 1 (admin) and workspace 2 (dev), sharing one
  # pid. Rift's auto-switch resolves the target from app-global state (the AX
  # main window / last WindowServer focus for the pid), which is not
  # workspace-aware, so raising the dev window activates Edge and drags the
  # workspace to whichever Edge window macOS currently calls "main" — usually
  # the admin one. Blacklisting keeps prev_window/next_window on this workspace.
  # Cost: activating Edge via Cmd+Tab/Dock/Spotlight no longer follows Edge to
  # its workspace. That follow was already picking an arbitrary Edge window.
  "com.microsoft.edgemac",
]
run_on_start = []
hot_reload = true

[settings.layout]
# OmniWM defaultLayoutType = "niri" maps to Rift's scrolling layout.
mode = "scrolling"

[settings.layout.scrolling]
# Glide enabled: each scroll step eases into the next so the rapid train of
# gesture steps reads as one smooth motion instead of discrete snaps.
animate = true
# OmniWM niri: columnWidthPresets included 0.66; focused column centered only on demand.
# Keep a 50% default column width for scrolling layouts.
column_width_ratio = 0.5
min_column_width_ratio = 0.25
max_column_width_ratio = 0.75
alignment = "left"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = false
invert_horizontal = true
fingers = 3
propagate_to_workspace_swipe = false
# Finer step threshold = smoother, less "chunky" tracking (default 0.08, min 0.01).
distance_pct = 0.02
vertical_tolerance = 0.4
workspace_switch_threshold = 0.625

[settings.layout.gaps.outer]
top = 8
left = 8
bottom = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 0
vertical = 8

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "master"

[settings.layout.stack]
stack_offset = 40.0
default_orientation = "perpendicular"

[settings.ui.menu_bar]
# OmniWM workspaceBar.enabled = false
# OmniWM statusBar.showAppNames/showWorkspaceName/useWorkspaceId = false
enabled = true
show_empty = false
mode = "all"
active_label = "index"
display_style = "layout"

[settings.ui.stack_line]
enabled = false
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.mission_control]
enabled = false
fade_enabled = false
fade_duration_ms = 180.0

[settings.gestures]
# OmniWM gestures: 3 fingers, inverted, option+shift modifier, sensitivity 5.
# Rift supports 3-finger workspace swipes but not the same modifier/sensitivity knobs.
enabled = false
invert_horizontal_swipe = true
swipe_vertical_tolerance = 0.4
skip_empty = false
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
# Keep only workspaces 1-5.
default_workspace_count = 5
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
reapply_app_rules_on_title_change = false
default_workspace = 0
workspace_names = ["1", "2", "3", "4", "5"]
workspace_rules = [
  { workspace = 0, layout = "scrolling" },
  { workspace = 1, layout = "scrolling" },
  { workspace = 2, layout = "scrolling" },
  { workspace = 3, layout = "scrolling" },
  { workspace = 4, layout = "scrolling" },
]

# `workspace` pins an app to a virtual workspace (0-based; 0="1" ... 4="5").
# `floating` makes matched windows float instead of tile.
# Omit manage=true for tiled apps: since Rift 0.5.4 it bypasses normal
# window filtering and can tile child dialogs. Keep explicit floating exceptions.
app_rules = [
  # Workspace 1 (index 0): Microsoft / work
  { app_id = "com.microsoft.edgemac.app.faolnafnngnfdaknnbpnkhgohbobgegn", workspace = 0 }, # Outlook PWA
  { app_id = "com.microsoft.teams2", workspace = 0 },
  { app_id = "com.tinyspeck.slackmacgap", workspace = 0 },
  { app_id = "com.microsoft.Word", workspace = 0 },
  { app_id = "com.microsoft.Excel", workspace = 0 },
  { app_id = "com.microsoft.Powerpoint", workspace = 0 },
  { app_id = "com.microsoft.onenote.mac", workspace = 0 },
  { app_id = "com.microsoft.Outlook", workspace = 0 },
  { app_id = "com.microsoft.OneDrive", workspace = 0 },

  # Workspace 2 (index 1): coding
  { app_id = "com.mitchellh.ghostty", workspace = 1 },
  { app_id = "com.github.wez.wezterm", workspace = 1 },
  { app_id = "net.kovidgoyal.kitty", workspace = 1 },
  { app_id = "org.alacritty", workspace = 1 },
  { app_id = "dev.warp.Warp-Stable", workspace = 1 },
  { app_id = "com.apple.Terminal", workspace = 1 },
  { app_id = "dev.zed.Zed", workspace = 1 },
  { app_id = "com.microsoft.VSCode", workspace = 1 },
  { app_id = "com.microsoft.VSCodeInsiders", workspace = 1 },
  { app_id = "com.todesktop.230313mzl4w4u92", workspace = 1 }, # Cursor
  { app_id = "com.t3tools.t3code", workspace = 1 },
  { app_id = "com.cmuxterm.app", workspace = 1 },
  { app_id = "com.conductor.app", workspace = 1 },
  { app_id = "com.augment.intent", workspace = 1 },
  { app_id = "com.anthropic.claudefordesktop", workspace = 1 },
  { app_id = "com.openai.codex", workspace = 1 }, # ChatGPT

  # Workspace 3 (index 2): personal
  { app_id = "net.imput.helium", workspace = 3 },
  { app_id = "com.google.Chrome", workspace = 2 },
  { app_id = "com.apple.MobileSMS", workspace = 2 },
  { app_id = "net.whatsapp.WhatsApp", workspace = 2 },
  { app_id = "com.spotify.client", workspace = 2 },

  # Floating windows (not pinned to a workspace)
  { app_id = "com.apple.systempreferences", manage = true, floating = true }, # System Settings
  { app_id = "io.tailscale.ipn.macsys", manage = true, floating = true },
  # Settings / hardware control panels (fixed-size windows that tile badly)
  { app_id = "com.1password.1password", manage = true, floating = true },
  { app_id = "org.pqrs.Karabiner-Elements.Settings", manage = true, floating = true },
  { app_id = "org.pqrs.Karabiner-EventViewer", manage = true, floating = true },
  { app_id = "com.elgato.StreamDeck", manage = true, floating = true },
  { app_id = "com.elgato.CameraHub", manage = true, floating = true },
  { app_id = "com.corsair.ControlCenter", manage = true, floating = true }, # Elgato Control Center
  { app_id = "com.audeze.AudezeHQ", manage = true, floating = true },
  { app_id = "com.displaylink.DisplayLinkUserAgent", manage = true, floating = true },
  { app_id = "com.microsoft.CompanyPortalMac", manage = true, floating = true },
  { app_id = "com.jamfsoftware.selfservice.mac", manage = true, floating = true },
  # Dictation tools: leave Wispr Flow unmanaged so its always-on-top/native
  # all-spaces status window is not captured by a virtual workspace.
  { app_id = "com.superduper.superwhisper", manage = true, floating = true },

  # Managed but unpinned (unchanged)
  { app_id = "com.eltima.cmd1.pro.mas" },
  { app_id = "com.apple.Safari" },
  { app_id = "app.zen-browser.zen" },
  { app_id = "org.mozilla.firefox" },
  { app_id = "company.thebrowser.dia" },
  { app_id = "com.hnc.Discord" },
]

[modifier_combinations]
rift = "Ctrl + Alt + Shift"
rift_cmd = "Ctrl + Alt + Shift + Meta"

[keys]
# Workspace switching/moving: OmniWM Control+Option+Shift+[1-5,Z,X,C,D]
"rift + 1" = { switch_to_workspace = 0 }
"rift_cmd + 1" = { move_window_to_workspace = 0 }
"rift + 2" = { switch_to_workspace = 1 }
"rift_cmd + 2" = { move_window_to_workspace = 1 }
"rift + 3" = { switch_to_workspace = 2 }
"rift_cmd + 3" = { move_window_to_workspace = 2 }
"rift + 4" = { switch_to_workspace = 3 }
"rift_cmd + 4" = { move_window_to_workspace = 3 }
"rift + 5" = { switch_to_workspace = 4 }
"rift_cmd + 5" = { move_window_to_workspace = 4 }
"rift + Tab" = "switch_to_last_workspace"
"rift + C" = "center_selection"

# Focus and move with the same A/R/W/S layout as OmniWM.
# IMPORTANT: Do not change horizontal focus back to `{ move_focus = "left/right" }`.
# In Rift's scrolling layout, directional left/right focus can lose focus at strip boundaries.
# `prev_window` / `next_window` wraps safely and avoids that bug.
"rift + A" = "prev_window"
"rift + R" = { move_focus = "down" }
"rift + W" = { move_focus = "up" }
"rift + S" = "next_window"
"rift_cmd + A" = { move_node = "left" }
"rift_cmd + R" = { move_node = "down" }
"rift_cmd + W" = { move_node = "up" }
"rift_cmd + S" = { move_node = "right" }
"rift_cmd + Z" = { join_window = "left" }
"rift_cmd + X" = { join_window = "right" }

# Workspace navigation/moving, matching OmniWM where Rift has equivalent commands.
"rift + Up" = { focus_display = "up" }
"rift + Down" = { focus_display = "down" }
"rift + PageUp" = "prev_workspace"
"rift + PageDown" = "next_workspace"

# Display focus. The external HP display is above the built-in display.
"Ctrl + Meta + Tab" = { focus_display = "down" }
"Ctrl + Meta + Grave" = { focus_display = "up" }
# Move the focused window to the display above or below.
"rift_cmd + Up" = { move_window_to_display = { selector = "up" } }
"rift_cmd + Down" = { move_window_to_display = { selector = "down" } }

# Fullscreen/floating/scrolling-column controls.
"rift + F" = "toggle_fullscreen"
"rift + P" = "toggle_fullscreen_within_gaps"
# Keep these as prev/next for the same boundary-focus reason above.
"rift + Left" = "prev_window"
"rift + Right" = "next_window"
"rift_cmd + Left" = { join_window = "left" }
"rift_cmd + Right" = { join_window = "right" }
"rift_cmd + D" = "unjoin_windows"
"Alt + Home" = { scroll_strip = { delta = -999.0 } }
"Alt + End" = { scroll_strip = { delta = 999.0 } }
# Normal resize.
"rift + G" = { resize_window_by = { amount = 0.05 } }
"rift + T" = { resize_window_by = { amount = -0.05 } }
# Resize and re-center the selected column. Useful because niri scrolling mode clears
# the temporary center override during resize.
"rift_cmd + G" = { exec = ["/bin/bash", "-lc", "rift-cli execute window resize-by 0.05 && rift-cli execute layout center-selection"] }
"rift_cmd + T" = { exec = ["/bin/bash", "-lc", "rift-cli execute window resize-by -- -0.05 && rift-cli execute layout center-selection"] }
"Alt + Shift + F" = "toggle_fullscreen_within_gaps"
"Alt + Shift + B" = "snap_strip"
"rift_cmd + B" = "toggle_stack"
"rift_cmd + F" = "toggle_window_floating"

# Rift equivalents for OmniWM command/menu/overview style actions.
"Alt + Shift + O" = "show_mission_control_all"
"rift + Space" = "show_mission_control_current"
"Ctrl + Alt + M" = { exec = ["/bin/bash", "-lc", "open -g 'x-apple.systempreferences:com.apple.preference.universalaccess' || true"] }

# Useful Rift-native commands retained for debugging/session management.
"Ctrl + Alt + Shift + Meta + Return" = { exec = ["/bin/bash", "-lc", "open -a Ghostty || open -a Terminal"] }
# "Ctrl + Alt + Shift + Meta + D" = "debug"
"Ctrl + Alt + Shift + Meta + Q" = "save_and_exit"
