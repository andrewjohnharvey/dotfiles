[ids]
*

[main]
rightalt = layer(mac)
sysrq = layer(meh)
leftmeta = layer(mac)
rightmeta = layer(mac)

[meh:C-A-S]

# :M suffix = unmapped keys pass through holding Super,
# so niri still sees Mod+Q, Mod+Space, Mod+Return, Mod+E, etc.
[mac:M]

# Clipboard / editing
c = C-c
v = C-v
x = C-x
a = C-a
z = C-z

# App/tab/file verbs
t = C-t
w = C-w
n = C-n
f = C-f
s = C-s
r = C-r
l = C-l
p = C-p
o = C-o
b = C-b
comma = C-comma

# Tab switching in apps (Cmd+1..9)
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9

# App switcher — Cmd+Tab → Alt+Tab
tab = A-tab

# Line / doc nav — Cmd+arrows. Shift passes through, so Cmd+Shift+arrow
# becomes Shift+Home/End/Ctrl+Home/End (Mac-style text selection).
left = home
right = end
up = C-home
down = C-end

# Zoom — Cmd+-/=
minus = C-minus
equal = C-equal

# Composite layer — active when BOTH meh (sysrq) and mac (rightalt/leftmeta) are held.
# sysrq + rightalt + q → prev tab, sysrq + rightalt + e → next tab
# a/s/w/r explicitly emit Meh+Super so niri sees move-column/window bindings.
[meh+mac]
q = C-S-tab
e = C-tab
a = M-C-A-S-a
s = M-C-A-S-s
w = M-C-A-S-w
r = M-C-A-S-r
1 = M-C-A-S-1
2 = M-C-A-S-2
3 = M-C-A-S-3
4 = M-C-A-S-4
5 = M-C-A-S-5
6 = M-C-A-S-6
7 = M-C-A-S-7
8 = M-C-A-S-8
9 = M-C-A-S-9

# Hardware keyboards such as the Go60 emit Meh as the real Ctrl+Alt+Shift
# modifiers rather than activating keyd's named `meh` layer. Match that
# equivalent modifier combination while preserving the Mac layer bindings.
[control+alt+shift+mac]
q = C-S-tab
e = C-tab
a = M-C-A-S-a
s = M-C-A-S-s
w = M-C-A-S-w
r = M-C-A-S-r
1 = M-C-A-S-1
2 = M-C-A-S-2
3 = M-C-A-S-3
4 = M-C-A-S-4
5 = M-C-A-S-5
6 = M-C-A-S-6
7 = M-C-A-S-7
8 = M-C-A-S-8
9 = M-C-A-S-9
